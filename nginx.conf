map "$remote_addr|$http_x_forwarded_for" $contact_trusted_client_ip {
  default $remote_addr;
  "10.88.0.24|10.88.0.17" $http_cf_connecting_ip;
}

map $contact_trusted_client_ip $contact_client_ip {
  default $contact_trusted_client_ip;
  "" $remote_addr;
}

limit_req_zone $contact_client_ip zone=contact_intake:1m rate=6r/m;

map $arg_lang $studio_entry {
  default /index.html;
  ~^fr$ /studio-fr.html;
}

map $arg_lang $product_entry {
  default /kurobara/index.html;
  ~^fr$ /kurobara/fr.html;
}

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name kurobara.systems _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  resolver 127.0.0.11 valid=15s ipv6=off;

  include /etc/nginx/security-headers.conf;

  location = /api/contact {
    limit_req zone=contact_intake burst=5 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    set $contact_backend http://contact-hub-http:8080;
    proxy_pass $contact_backend/v1/intake/kurobara;
    proxy_set_header Host $host;
    proxy_set_header X-Contact-Client-IP $contact_client_ip;
    proxy_set_header X-Contact-Proxy-Token "${CONTACT_HUB_PROXY_TOKEN}";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_next_upstream off;
    access_log off;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  if ($request_uri ~ "^//") {
    return 308 https://kurobara.systems/;
  }

  location = / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $studio_entry =404;
  }

  location = /kurobara {
    return 308 https://kurobara.systems/kurobara/$is_args$args;
  }

  location = /kurobara/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $product_entry =404;
  }

  location = /kurobara/index.html {
    return 308 https://kurobara.systems/kurobara/$is_args$args;
  }

  location = /studio-fr.html {
    internal;
  }

  location = /kurobara/fr.html {
    internal;
  }

  location = /healthz {
    access_log off;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /index.html {
    return 308 https://kurobara.systems/$is_args$args;
  }

  location = /robots.txt {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    default_type text/plain;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    default_type application/xml;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location ~ ^/(kurobara/)?site(-fr)?\.webmanifest$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location ^~ /assets/social/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /favicon.svg {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /assets/kurobara-rose.webp {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /assets/social/og-kurobara.jpg {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location ^~ /licenses/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|jpe?g|woff2?|png|svg|webmanifest|webp)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri =404;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name www.kurobara.systems;

  server_tokens off;
  include /etc/nginx/security-headers.conf;

  return 308 https://kurobara.systems$request_uri;
}
