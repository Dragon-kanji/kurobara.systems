name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify website
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.4

      - name: Install locked dependencies
        run: npm ci

      - name: Audit the locked dependency graph
        run: npm run security:audit:all

      - name: Check formatting and code quality
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the production image
        run: docker build --tag kurobara-website:ci .

      - name: Verify production routes and first-response languages
        run: |
          docker run --detach --rm --name website-ci --publish 127.0.0.1:8080:8080 kurobara-website:ci
          trap 'docker stop website-ci' EXIT
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8080/healthz
          npm run test:server

      - name: Refuse generated drift
        run: git diff --exit-code
